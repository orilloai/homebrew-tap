# The tap's syntax, as Homebrew reads it, on every pull request and every push to main.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-bot:
    runs-on: ubuntu-24.04
    steps:
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ github.token }}
      - run: brew test-bot --only-tap-syntax
